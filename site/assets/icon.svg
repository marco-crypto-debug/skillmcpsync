<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- macOS Squircle Background -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bg)" filter="url(#shadow)" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
  
  <!-- Subtle Grid Lines -->
  <path d="M128 32v448 M256 32v448 M384 32v448 M32 128h448 M32 256h448 M32 384h448" stroke="rgba(255,255,255,0.03)" stroke-width="1.5" />

  <!-- Connecting Beams -->
  <line x1="256" y1="256" x2="160" y2="160" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" stroke-opacity="0.7" stroke-dasharray="8 8" />
  <line x1="256" y1="256" x2="352" y2="160" stroke="#818CF8" stroke-width="6" stroke-linecap="round" stroke-opacity="0.7" stroke-dasharray="8 8" />
  <line x1="256" y1="256" x2="160" y2="352" stroke="#34D399" stroke-width="6" stroke-linecap="round" stroke-opacity="0.7" stroke-dasharray="8 8" />
  <line x1="256" y1="256" x2="352" y2="352" stroke="#F472B6" stroke-width="6" stroke-linecap="round" stroke-opacity="0.7" stroke-dasharray="8 8" />
  <line x1="256" y1="256" x2="256" y2="130" stroke="#FBBF24" stroke-width="6" stroke-linecap="round" stroke-opacity="0.7" stroke-dasharray="8 8" />

  <!-- Peripheral Agent Nodes -->
  <circle cx="160" cy="160" r="28" fill="#0284C7" stroke="#BAE6FD" stroke-width="3" />
  <circle cx="352" cy="160" r="28" fill="#6366F1" stroke="#E0E7FF" stroke-width="3" />
  <circle cx="160" cy="352" r="28" fill="#059669" stroke="#A7F3D0" stroke-width="3" />
  <circle cx="352" cy="352" r="28" fill="#D946EF" stroke="#FBCFE8" stroke-width="3" />
  <circle cx="256" cy="130" r="24" fill="#D97706" stroke="#FDE68A" stroke-width="3" />

  <!-- Center Hub Pulsing Circle -->
  <circle cx="256" cy="256" r="64" fill="url(#glow)" />
  <circle cx="256" cy="256" r="52" fill="url(#accent)" stroke="#FFFFFF" stroke-width="4" />

  <!-- Central Lightning / Synchronization Icon -->
  <path d="M268 214l-24 40h20l-16 44 36-48h-20l12-36z" fill="#FFFFFF" />
</svg>
